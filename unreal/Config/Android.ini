; Curbside — the Android settings, merged into your project's
; Config/DefaultEngine.ini by unreal/Tools/configure_android.py.
;
; Kept here rather than edited by hand in Project Settings so the values are
; reviewable, repeatable, and the same on any machine that builds this. Change
; them here and re-run the script; do not edit DefaultEngine.ini directly, or
; the next run will put them back.

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
; Distinct from the old Expo build's app.eatyourway.game, so the two can sit
; side by side on the phone instead of one replacing the other.
PackageName=com.upliftdigital.curbside
ApplicationDisplayName=Curbside
VersionDisplayName=0.1
StoreVersion=1

; 26 is the floor for the modern audio and file APIs UE 5.7 uses; 34 is what
; Play requires. Both well inside the r27c NDK already installed.
MinSDKVersion=26
TargetSDKVersion=34

; arm64 only. Every phone made in the last decade is arm64, and building x86_64
; as well doubles the packaging time for an emulator nobody will use.
bBuildForArm64=True
bBuildForX8664=False

; Vulkan first, ES3.1 as the fallback. Vulkan is where the instanced city
; actually performs; ES3.1 keeps it launching on older hardware.
bSupportsVulkan=True
bBuildForES31=True

bPackageDataInsideApk=True
bFullScreen=True
Orientation=Landscape

; We draw our own stick and buttons in ACurbsideHUD, driven by
; ACurbsidePlayerController. The engine's virtual joysticks would sit on top of
; them and eat the touches.
bShowLaunchImage=True

[/Script/Engine.InputSettings]
; Same reason: no engine touch interface, and the mouse should act as a finger
; so the on-screen controls can be tested in the editor with curbside.Touch 1.
DefaultTouchInterface=None
bUseMouseForTouch=True
bAlwaysShowTouchInterface=False

[/Script/Engine.RendererSettings]
; Mobile has no Lumen and no virtual shadow maps; asking for them costs shader
; permutations and gets a fallback anyway. The city is untextured boxes, so
; distance-field shadows from one directional light are all it needs.
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.VirtualTextures=False

[/Script/UnrealEd.ProjectPackagingSettings]
; Everything Curbside creates lives under /Game/Curbside, and the input actions
; are loaded by path at runtime rather than through a hard reference. Cooking
; the folder wholesale means a missed reference cannot quietly strip an asset
; out of the APK and leave a control dead on the phone.
+DirectoriesToAlwaysCook=(Path="/Game/Curbside")
